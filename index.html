<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>SUPEN Stats — Estadísticas de Pensiones de Costa Rica</title>
    <meta
      name="description"
      content="Dashboard educativo e interactivo con estadísticas de la Superintendencia de Pensiones de Costa Rica: rentabilidad, comisiones, portafolio, afiliados, pensionados y simulador de pensión."
    />
    <meta
      name="keywords"
      content="SUPEN, pensiones, Costa Rica, ROP, rentabilidad, comisiones, portafolio, afiliados, pensión, educación financiera"
    />
    <meta name="author" content="SUPEN Stats contributors" />
    <meta name="robots" content="index,follow" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#202331" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f9fafb" media="(prefers-color-scheme: light)" />

    <!-- PWA (Fase 3) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SUPEN Stats" />

    <!-- Open Graph / redes sociales -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SUPEN Stats" />
    <meta property="og:title" content="SUPEN Stats — Estadísticas de Pensiones de Costa Rica" />
    <meta
      property="og:description"
      content="Visualiza y entiende el sistema de pensiones de Costa Rica: rentabilidad, comisiones, portafolio, demografía y proyección de tu pensión."
    />
    <meta property="og:locale" content="es_CR" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:alt" content="SUPEN Stats — Dashboard de estadísticas de pensiones de Costa Rica" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SUPEN Stats — Estadísticas de Pensiones de Costa Rica" />
    <meta name="twitter:description" content="Visualiza y entiende el sistema de pensiones de Costa Rica." />
    <meta name="twitter:image" content="/og-image.png" />

    <script>
      // Aplica el tema antes del primer render para evitar un destello (FOUC).
      // Usa la preferencia guardada en localStorage o, si no existe, el tema
      // del sistema operativo.
      (function () {
        try {
          var stored = localStorage.getItem('supen-theme')
          var dark = stored
            ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
